<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Ian Swartz's Minigames - Rock-Paper-Scissors-Lizard-Spock</title>
    <link rel="stylesheet" href="styles.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  </head>
  <body>
    <div id="wrapper">
      <header>
        <div id="game1-header">
          <h1>Rock-Paper-Scissors-Lizard-Spock</h1>
        </div>
      </header>

      <nav>
        <a href="index.html">Home</a> &nbsp;
        <a href="game1.html">Game 1</a> &nbsp;
        <a href="game2.html">Game 2</a> &nbsp;
        <a href="game3.html">Game 3</a>
      </nav>

      <div class="score-board">
        <div id="user-label" class="badge">User</div>
        <div id="comp-label" class="badge">Comp</div>
        <span id="user-score">0</span>:<span id="comp-score">0</span>
      </div>

      <div class="hearts-row">
        <div class="health-box">
          <div id="user-hearts" class="hearts">
            <img src="images/heart.png" class="heart user-heart" alt="heart" />
            <img src="images/heart.png" class="heart user-heart" alt="heart" />
            <img src="images/heart.png" class="heart user-heart" alt="heart" />
            <img src="images/heart.png" class="heart user-heart" alt="heart" />
            <img src="images/heart.png" class="heart user-heart" alt="heart" />
            <img src="images/heart.png" class="heart user-heart" alt="heart" />
            <img src="images/heart.png" class="heart user-heart" alt="heart" />
            <img src="images/heart.png" class="heart user-heart" alt="heart" />
            <img src="images/heart.png" class="heart user-heart" alt="heart" />
            <img src="images/heart.png" class="heart user-heart" alt="heart" />
          </div>
        </div>

        <div class="hearts-spacer"></div>

        <div class="health-box">
          <div id="comp-hearts" class="hearts">
            <img src="images/heart.png" class="heart comp-heart" alt="heart" />
            <img src="images/heart.png" class="heart comp-heart" alt="heart" />
            <img src="images/heart.png" class="heart comp-heart" alt="heart" />
            <img src="images/heart.png" class="heart comp-heart" alt="heart" />
            <img src="images/heart.png" class="heart comp-heart" alt="heart" />
            <img src="images/heart.png" class="heart comp-heart" alt="heart" />
            <img src="images/heart.png" class="heart comp-heart" alt="heart" />
            <img src="images/heart.png" class="heart comp-heart" alt="heart" />
            <img src="images/heart.png" class="heart comp-heart" alt="heart" />
            <img src="images/heart.png" class="heart comp-heart" alt="heart" />
          </div>
        </div>
      </div>

      <div class="result">
        <p>Lizard poisons Spock. You win!</p>
      </div>

      <div class="choices">
        <div class="pick" id="rock">
          <img src="images/rock.png" alt="" />
        </div>
        <div class="pick" id="paper">
          <img src="images/paper.png" alt="" />
        </div>
        <div class="pick" id="scissors">
          <img src="images/scissors.png" alt="" />
        </div>
        <div class="pick" id="lizard">
          <img src="images/lizard.png" alt="" />
        </div>
        <div class="pick" id="spock">
          <img src="images/spock.png" alt="" />
        </div>
      </div>

      <p id="action-message">Make your choice! First to 10 wins!</p>

      <footer>Copyright &copy 2025 Ian Swartz's Mini Games</footer>
    </div>
    <script type="text/javascript" src="game1.js"></script>
  </body>
</html>
